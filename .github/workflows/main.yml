name: AI PR Review Agent

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'generic-service' }}
      REVIEW_FOCUS: ${{ vars.REVIEW_FOCUS || 'generic service' }}
      REVIEW_CONTEXT: ${{ vars.REVIEW_CONTEXT || 'Review PRs for correctness, security, and service compatibility.' }}
      REVIEW_STANDARDS: ${{ vars.REVIEW_STANDARDS || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect repository contents
        run: |
          pwd
          ls -la
          find . -maxdepth 2 \( -name pom.xml -o -name build.gradle -o -name build.gradle.kts \) -print

      - name: Detect build tool
        id: detect-build
        run: |
          if [ -f pom.xml ]; then
            echo "build_tool=maven" >> "$GITHUB_OUTPUT"
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "build_tool=gradle" >> "$GITHUB_OUTPUT"
          else
            echo "build_tool=none" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected build tool: $(cat "$GITHUB_OUTPUT")"

      - name: Build project with Maven
        if: steps.detect-build.outputs.build_tool == 'maven'
        run: mvn -B test
        continue-on-error: true

      - name: Build project with Gradle
        if: steps.detect-build.outputs.build_tool == 'gradle'
        run: ./gradlew test
        continue-on-error: true

      - name: Skip build for non-Java projects
        if: steps.detect-build.outputs.build_tool == 'none'
        run: echo "No Maven or Gradle build file found; skipping build step."

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run configured rule review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/run_rule_review.py

      - name: Run LLM-based review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          REVIEW_FOCUS: ${{ env.REVIEW_FOCUS }}
          REVIEW_CONTEXT: ${{ env.REVIEW_CONTEXT }}
          REVIEW_STANDARDS: ${{ env.REVIEW_STANDARDS }}
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            python scripts/run_llm_review.py
          else
            echo "No LLM API key configured; skipping LLM review."
          fi

      - name: Create review summary
        id: review-summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "## 🤖 AI PR Review Agent" > review-summary.md
          echo "" >> review-summary.md
          echo "- Service: $SERVICE_NAME" >> review-summary.md
          echo "- Focus: $REVIEW_FOCUS" >> review-summary.md
          echo "- Context: $REVIEW_CONTEXT" >> review-summary.md
          echo "" >> review-summary.md
          echo "### Rule-based findings" >> review-summary.md
          if [ -f rule-review.json ]; then
            python -c 'import json, pathlib; path = pathlib.Path("rule-review.json"); data = json.loads(path.read_text()) if path.exists() else []; output = "- No rule violations found" if not data else "\n".join([f"- [{item[\"severity\"]}] {item[\"rule_name\"]}: {item[\"message\"]}" for item in data[:5]]); print(output)' >> review-summary.md
          else
            echo "- Rule review output not found" >> review-summary.md
          fi
          echo "" >> review-summary.md
          echo "### LLM review" >> review-summary.md
          if [ -f llm-review.md ]; then
            cat llm-review.md >> review-summary.md
          else
            echo "- LLM review was not run because no API key was configured." >> review-summary.md
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-summary.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
