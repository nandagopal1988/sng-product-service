name: AI PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'generic-service' }}
      REVIEW_FOCUS: ${{ vars.REVIEW_FOCUS || 'generic service' }}
      REVIEW_CONTEXT: ${{ vars.REVIEW_CONTEXT || 'Review PRs for correctness, security, and service compatibility.' }}
      REVIEW_STANDARDS: ${{ vars.REVIEW_STANDARDS || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/smoke_test.py

      - name: Create review summary
        id: review-summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "## 🤖 AI PR Review Agent" > review-summary.md
          echo "" >> review-summary.md
          echo "- Service: $SERVICE_NAME" >> review-summary.md
          echo "- Focus: $REVIEW_FOCUS" >> review-summary.md
          echo "- Context: $REVIEW_CONTEXT" >> review-summary.md
          echo "" >> review-summary.md
          echo "The agent smoke test completed successfully for this pull request." >> review-summary.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-summary.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
